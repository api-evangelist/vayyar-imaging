apis:
- name: Walabot Storefront Agent Commerce (UCP)
  description: >-
    Agent-facing commerce surface of the Walabot DIY storefront (walabot.com,
    a Shopify store operated by Vayyar): unauthenticated read-only product
    JSON endpoints (/products/{handle}.json, /collections/{handle}/products.json),
    a Universal Commerce Protocol merchant profile at /.well-known/ucp, and a
    hosted MCP endpoint at /api/ucp/mcp for catalog search, cart, and
    buyer-approved checkout. Documented for agents in /llms.txt and /agents.md.
  humanURL: https://walabot.com/llms.txt
  baseURL: https://walabot.com
