aid: vayyar-imaging
name: Vayyar Imaging
description: >-
  Vayyar Imaging is an Israeli sensor company whose 4D imaging radar-on-chip
  technology senses, monitors, and images people and objects without cameras.
  Its RF sensors power Vayyar Care touchless fall detection for elderly care,
  automotive in-cabin monitoring, smart buildings, public safety, robotics,
  and the consumer Walabot DIY in-wall imager. Vayyar's developer surface
  today centers on the Walabot SDK documentation (api.walabot.com) and the
  Walabot storefront's agent-commerce endpoints (llms.txt, UCP, and a hosted
  MCP endpoint on walabot.com).
